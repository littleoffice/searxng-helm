{{- if and .Values.valkey.enabled (not .Values.valkey.auth.existingSecret) }}
{{- $password := "" }}
{{- if .Values.valkey.auth.enabled }}
{{- $password = include "searxng.valkey.passwordValue" . }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "searxng.valkey.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "searxng.valkey.labels" . | nindent 4 }}
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
type: Opaque
stringData:
  {{- if .Values.valkey.auth.enabled }}
  valkey-password: {{ $password | quote }}
  {{- end }}
  # Shipped as Secret-mounted files rather than CLI flags so the password never
  # shows up in `ps`.
  valkey.conf: |
    # Managed by Helm — primary.
    port 6379
    # No `bind` directive: listen on all interfaces inside the pod netns.
    protected-mode {{ if .Values.valkey.auth.enabled }}yes{{ else }}no{{ end }}
    {{- if .Values.valkey.auth.enabled }}
    requirepass {{ $password }}
    {{- end }}
    dir /data
    loglevel warning
    {{- if .Values.valkey.persistence.enabled }}
    save 30 1
    {{- else }}
    save ""
    {{- end }}
    appendonly no
    {{- if include "searxng.valkey.replicationEnabled" . }}
    # Replicas stream from here. min-replicas-to-write is deliberately left at
    # 0: this is a cache, and refusing writes when replicas lag would take
    # SearXNG's limiter down with it.
    repl-diskless-sync yes
    repl-diskless-sync-delay 5
    {{- end }}
    {{- with .Values.valkey.extraConfig }}
    {{- . | nindent 4 }}
    {{- end }}
  {{- if include "searxng.valkey.replicationEnabled" . }}
  valkey-replica.conf: |
    # Managed by Helm — replica.
    port 6379
    protected-mode {{ if .Values.valkey.auth.enabled }}yes{{ else }}no{{ end }}
    {{- if .Values.valkey.auth.enabled }}
    requirepass {{ $password }}
    masterauth {{ $password }}
    {{- end }}
    dir /data
    loglevel warning
    save ""
    appendonly no
    replicaof {{ include "searxng.valkey.primaryHost" . }} 6379
    replica-read-only yes
    # Keep serving reads from a stale copy rather than erroring while the link
    # to the primary is down — appropriate for a cache.
    replica-serve-stale-data yes
    {{- with .Values.valkey.extraConfig }}
    {{- . | nindent 4 }}
    {{- end }}
  {{- end }}
{{- end }}
