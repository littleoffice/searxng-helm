{{- if .Values.metrics.serviceMonitor.enabled }}
{{- $sm := .Values.metrics.serviceMonitor }}
{{- $ns := $sm.namespace | default .Release.Namespace }}
{{- $created := false }}
{{- if include "searxng.metricsEnabled" . }}
{{- $created = true }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "searxng.fullname" . }}
  namespace: {{ $ns }}
  labels:
    {{- include "searxng.serverLabels" . | nindent 4 }}
    {{- with $sm.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  {{- if ne $ns .Release.Namespace }}
  namespaceSelector:
    matchNames:
      - {{ .Release.Namespace }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "searxng.selectorLabels" . | nindent 6 }}
  endpoints:
    - port: http
      path: /metrics
      scheme: http
      interval: {{ $sm.interval }}
      scrapeTimeout: {{ $sm.scrapeTimeout }}
      honorLabels: {{ $sm.honorLabels }}
      # SearXNG gates /metrics behind HTTP Basic auth; it only checks the
      # password, but a username has to be sent.
      # Both halves come from the Secret named by searxng.metrics.existingSecret.
      # The chart renders no credential of its own here: the password has to
      # equal general.open_metrics in a settings.yml it cannot read.
      basicAuth:
        username:
          name: {{ include "searxng.metricsSecretName" . }}
          key: {{ include "searxng.metricsSecretUsernameKey" . }}
        password:
          name: {{ include "searxng.metricsSecretName" . }}
          key: {{ include "searxng.metricsSecretPasswordKey" . }}
      {{- with $sm.relabelings }}
      relabelings:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $sm.metricRelabelings }}
      metricRelabelings:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
{{- if .Values.mcpRelay.enabled }}
{{- range $r := (include "searxng.relay.instanceList" $ | fromYamlArray) }}
{{- $inst := dict "ctx" $ "relay" $r }}
{{- if $r.metrics.enabled }}
{{- if $created }}
---
{{- end }}
{{- $created = true }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "searxng.relay.fullname" $inst }}
  namespace: {{ $ns }}
  labels:
    {{- include "searxng.relay.labels" $inst | nindent 4 }}
    {{- with $sm.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  {{- if ne $ns $.Release.Namespace }}
  namespaceSelector:
    matchNames:
      - {{ $.Release.Namespace }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "searxng.relay.selectorLabels" $inst | nindent 6 }}
  endpoints:
    - port: http
      path: /metrics
      scheme: http
      interval: {{ $sm.interval }}
      scrapeTimeout: {{ $sm.scrapeTimeout }}
      honorLabels: {{ $sm.honorLabels }}
      # Same bearer scheme as the tool endpoints, but a dedicated identity so
      # scrapes are distinguishable from agent traffic in the audit log.
      authorization:
        type: Bearer
        credentials:
          name: {{ include "searxng.relay.scrapeSecretName" $inst }}
          key: {{ include "searxng.relay.scrapeSecretKey" $inst }}
      {{- with $sm.relabelings }}
      relabelings:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $sm.metricRelabelings }}
      metricRelabelings:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- if and .Values.valkey.enabled .Values.valkey.metrics.enabled }}
{{- if $created }}
---
{{- end }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "searxng.valkey.fullname" . }}
  namespace: {{ $ns }}
  labels:
    {{- include "searxng.valkey.labels" . | nindent 4 }}
    {{- with $sm.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  {{- if ne $ns .Release.Namespace }}
  namespaceSelector:
    matchNames:
      - {{ .Release.Namespace }}
  {{- end }}
  # Matches both the primary and the replica Services.
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "searxng.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
    matchExpressions:
      - key: app.kubernetes.io/component
        operator: In
        values:
          - valkey-primary
          - valkey-replica
  endpoints:
    - port: metrics
      path: /metrics
      scheme: http
      interval: {{ $sm.interval }}
      scrapeTimeout: {{ $sm.scrapeTimeout }}
      honorLabels: {{ $sm.honorLabels }}
      {{- with $sm.relabelings }}
      relabelings:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $sm.metricRelabelings }}
      metricRelabelings:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
{{- end }}
