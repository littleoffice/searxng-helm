{{- if .Values.mcpRelay.enabled }}
{{- range $i, $r := (include "searxng.relay.instanceList" $ | fromYamlArray) }}
{{- $inst := dict "ctx" $ "relay" $r }}
{{- if $r.ingress.enabled }}
{{- $name := include "searxng.relay.fullname" $inst }}
{{- $svcPort := $r.service.port }}
{{- if $i }}
---
{{- end }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "searxng.relay.labels" $inst | nindent 4 }}
  {{- with (merge (dict) $r.ingress.annotations $.Values.commonAnnotations) }}
  annotations:
    {{- include "searxng.renderAnnotations" . | nindent 4 }}
  {{- end }}
spec:
  {{- with $r.ingress.className }}
  ingressClassName: {{ . | quote }}
  {{- end }}
  {{- with $r.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- range $r.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType | default "Prefix" }}
            backend:
              service:
                name: {{ $name }}
                port:
                  number: {{ $svcPort }}
          {{- end }}
    {{- end }}
{{- end }}
{{- end }}
{{- end }}
