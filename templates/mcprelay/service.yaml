{{- if .Values.mcpRelay.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "searxng.relay.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "searxng.relay.labels" . | nindent 4 }}
  {{- with (merge (dict) .Values.mcpRelay.service.annotations .Values.commonAnnotations) }}
  annotations:
    {{- include "searxng.renderAnnotations" . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.mcpRelay.service.type }}
  ports:
    - name: http
      port: {{ .Values.mcpRelay.service.port }}
      targetPort: http
      protocol: TCP
      appProtocol: http
  selector:
    {{- include "searxng.relay.selectorLabels" . | nindent 4 }}
{{- end }}
