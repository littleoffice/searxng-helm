{{- if .Values.mcpRelay.enabled }}
{{- range $i, $r := (include "searxng.relay.instanceList" $ | fromYamlArray) }}
{{- $inst := dict "ctx" $ "relay" $r }}
{{- if $r.podDisruptionBudget.enabled }}
{{- if $i }}
---
{{- end }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "searxng.relay.fullname" $inst }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "searxng.relay.labels" $inst | nindent 4 }}
spec:
  maxUnavailable: {{ $r.podDisruptionBudget.maxUnavailable }}
  selector:
    matchLabels:
      {{- include "searxng.relay.selectorLabels" $inst | nindent 6 }}
{{- end }}
{{- end }}
{{- end }}
