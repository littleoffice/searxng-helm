{{- if .Values.mcpRelay.enabled }}
{{- include "searxng.assertHardenedAll" . -}}
{{- include "searxng.relay.validate" . -}}
{{- $r := .Values.mcpRelay }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "searxng.relay.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "searxng.relay.labels" . | nindent 4 }}
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  replicas: {{ $r.replicaCount }}
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
  selector:
    matchLabels:
      {{- include "searxng.relay.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        # The token file is mounted with subPath semantics via a Secret volume;
        # roll the pods when the token set changes.
        checksum/auth: {{ include "searxng.relay.tokenFile" . | sha256sum }}
{{/*
There is deliberately no checksum for the engine tokens: they come from a
Secret the chart does not render and cannot read, so it has nothing to hash.
SEARXNG_TOKENS is read once at startup, so `kubectl rollout restart` after
editing that Secret — the same caveat as settings.yml.
*/}}
        {{- with .Values.commonAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "searxng.relay.labels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "searxng.relay.serviceAccountName" . }}
      automountServiceAccountToken: {{ $r.serviceAccount.automountServiceAccountToken }}
      enableServiceLinks: false
      {{- if .Values.userNamespaces.enabled }}
      hostUsers: false
      {{- end }}
      # The relay drains for up to 30s on SIGTERM and exits non-zero if the
      # window closes with requests still in flight, so 30 here would cut every
      # rollout's drain short.
      terminationGracePeriodSeconds: {{ $r.terminationGracePeriodSeconds }}
      {{- with $r.priorityClassName }}
      priorityClassName: {{ . | quote }}
      {{- end }}
      securityContext:
        {{- toYaml $r.podSecurityContext | nindent 8 }}
      containers:
        - name: mcp-relay
          image: {{ include "searxng.relay.image" . | quote }}
          imagePullPolicy: {{ $r.image.pullPolicy }}
          securityContext:
            {{- toYaml $r.containerSecurityContext | nindent 12 }}
          env:
            - name: MCP_PORT
              value: {{ $r.service.port | quote }}
            - name: SEARXNG_URL
              value: {{ include "searxng.relay.searxngUrl" . | quote }}
            - name: MCP_AUTH_TOKEN_FILE
              value: /etc/mcp-auth/{{ include "searxng.relay.secretKey" . }}
            {{- if include "searxng.relay.engineTokensEnabled" . }}
            - name: SEARXNG_TOKENS
              valueFrom:
                secretKeyRef:
                  name: {{ include "searxng.relay.engineTokensSecretName" . }}
                  key: {{ include "searxng.relay.engineTokensSecretKey" . }}
            {{- end }}
            - name: MCP_STATELESS
              value: {{ $r.stateless | quote }}
            - name: LOG_LEVEL
              value: {{ $r.logLevel | quote }}
            - name: LOG_FORMAT
              value: {{ $r.logFormat | quote }}
            - name: MCP_SESSION_MAX_AGE
              value: {{ $r.session.maxAge | quote }}
            - name: MCP_SESSION_JANITOR_INTERVAL
              value: {{ $r.session.janitorInterval | quote }}
            - name: MCP_RATE_LIMIT_RPS
              value: {{ $r.rateLimit.rps | quote }}
            {{- with $r.rateLimit.burst }}
            - name: MCP_RATE_LIMIT_BURST
              value: {{ . | quote }}
            {{- end }}
            {{- with $r.rateLimit.exempt }}
            - name: MCP_RATE_LIMIT_EXEMPT
              value: {{ join "," . | quote }}
            {{- end }}
            {{- with $r.fetch.allowedHosts }}
            - name: FETCH_ALLOWED_HOSTS
              value: {{ join "," . | quote }}
            {{- end }}
            {{- with $r.fetch.allowedCIDRs }}
            - name: FETCH_ALLOWED_CIDRS
              value: {{ join "," . | quote }}
            {{- end }}
            {{- with $r.fetch.proxy }}
            # Deliberately not HTTP_PROXY/HTTPS_PROXY: the relay reads this one
            # only, so an ambient proxy variable cannot redirect fetches.
            - name: FETCH_PROXY
              value: {{ . | quote }}
            {{- if $r.fetch.proxyAll }}
            - name: FETCH_PROXY_ALL
              value: "true"
            {{- end }}
            {{- end }}
            {{- if include "searxng.relay.fenceKeyEnabled" . }}
            # Persistent fence signing key, as a file. Never as an env var: the
            # value is a private key, and the file form is what survives
            # `kubectl describe` and a rendered manifest without it.
            - name: FENCE_SIGNING_KEY_FILE
              value: {{ include "searxng.relay.fenceKeyPath" . | quote }}
            {{- end }}
            {{- if include "searxng.relay.healthTokenEnabled" . }}
            - name: MCP_HEALTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "searxng.relay.healthTokenSecretName" . }}
                  key: {{ include "searxng.relay.healthTokenSecretKey" . }}
            {{- end }}
            {{- if $r.metrics.enabled }}
            # /metrics has its own credential on relay images that gate it
            # separately; older ones ignore this and gate on the MCP token
            # table, which metrics.mcpIdentity keeps the same value in.
            - name: MCP_METRICS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "searxng.relay.scrapeSecretName" . }}
                  key: {{ include "searxng.relay.scrapeSecretKey" . }}
            {{- end }}
            {{- range $k, $v := $r.config }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
            {{- with $r.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: http
              containerPort: {{ $r.service.port | int }}
              protocol: TCP
          # Liveness is TCP on purpose: /health checks upstream SearXNG, and a
          # transient SearXNG outage should not get the relay killed.
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            {{- if include "searxng.relay.healthTokenEnabled" . }}
            # /health is gated by a bearer token. A Kubernetes httpGet probe
            # can only carry a literal header, which would put the token in
            # this manifest in plain text — so the probe is the relay's own
            # self-probe instead: it reads $MCP_HEALTH_TOKEN and sends the
            # header itself, leaving the value in the Secret it came from.
            exec:
              command: ["/mcp-searxng-relay", "--healthcheck"]
            {{- else }}
            httpGet:
              path: /health
              port: http
            {{- end }}
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml $r.resources | nindent 12 }}
          volumeMounts:
            - name: auth
              mountPath: /etc/mcp-auth
              readOnly: true
            {{- if include "searxng.relay.fenceKeyEnabled" . }}
            - name: fence-key
              mountPath: /etc/mcp-fence
              readOnly: true
            {{- end }}
            {{- with $r.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: auth
          secret:
            secretName: {{ include "searxng.relay.secretName" . }}
            defaultMode: 0400
        {{- if include "searxng.relay.fenceKeyEnabled" . }}
        - name: fence-key
          secret:
            secretName: {{ include "searxng.relay.fenceKeySecretName" . }}
            defaultMode: 0400
            items:
              - key: {{ include "searxng.relay.fenceKeySecretKey" . }}
                path: {{ include "searxng.relay.fenceKeySecretKey" . }}
        {{- end }}
        {{- with $r.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with $r.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $r.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $r.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
