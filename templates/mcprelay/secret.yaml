{{- if .Values.mcpRelay.enabled }}
{{- include "searxng.relay.validate" . -}}
{{- range $i, $r := (include "searxng.relay.instanceList" $ | fromYamlArray) }}
{{- $inst := dict "ctx" $ "relay" $r }}
{{- if not $r.auth.existingSecret }}
{{- if $i }}
---
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "searxng.relay.fullname" $inst }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "searxng.relay.labels" $inst | nindent 4 }}
  {{- with $.Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
type: Opaque
stringData:
  # Mounted at /etc/mcp-auth/tokens and read via $MCP_AUTH_TOKEN_FILE. One file
  # per instance: an identity is a caller of this relay, and two instances
  # exist precisely so their callers cannot reach each other's engines.
  tokens: |
    {{- include "searxng.relay.tokenFile" $inst | nindent 4 }}
{{- end }}
{{- if and $r.metrics.enabled (not $r.metrics.existingSecret) }}
---
# Separate object from the token file so that read access for Prometheus can be
# scoped to this Secret alone, without also granting access to agent tokens.
#
# On relay images that gate /metrics on the MCP token table, this value is
# necessarily also the `prometheus` line inside that instance's token file
# (metrics.mcpIdentity). Splitting the objects narrows who needs access to the
# file; it does not remove the token from it.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "searxng.relay.scrapeSecretName" $inst }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "searxng.relay.labels" $inst | nindent 4 }}
  {{- with $.Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
type: Opaque
stringData:
  scrape-token: {{ include "searxng.relay.scrapeToken" $inst | quote }}
{{- end }}
{{- end }}
{{- end }}
