{{- if and .Values.mcpRelay.enabled (not .Values.mcpRelay.auth.existingSecret) }}
{{- include "searxng.relay.validate" . -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "searxng.relay.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "searxng.relay.labels" . | nindent 4 }}
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
type: Opaque
stringData:
  # Mounted at /etc/mcp-auth/tokens and read via $MCP_AUTH_TOKEN_FILE.
  tokens: |
    {{- include "searxng.relay.tokenFile" . | nindent 4 }}

{{- end }}
{{- if and .Values.mcpRelay.enabled .Values.mcpRelay.searxngTokens.tokens (not .Values.mcpRelay.searxngTokens.existingSecret) }}
---
# SearXNG private-engine tokens, injected as $SEARXNG_TOKENS.
#
# A separate object from the agent token file above on purpose: these two
# secrets have different blast radii. The agent tokens let a caller reach this
# relay; these let this relay reach a set of engines on a shared SearXNG. An
# operator granting Prometheus or a debugging service account read access to
# one should not thereby grant the other.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "searxng.relay.engineTokensSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "searxng.relay.labels" . | nindent 4 }}
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
type: Opaque
stringData:
  searxng-tokens: {{ include "searxng.relay.engineTokens" . | quote }}
{{- end }}
{{- if and .Values.mcpRelay.enabled .Values.mcpRelay.metrics.enabled (not .Values.mcpRelay.metrics.existingSecret) }}
---
# Separate object from the token file so that read access for Prometheus can be
# scoped to this Secret alone, without also granting access to agent tokens.
#
# The value is necessarily a duplicate of the `prometheus` line inside the
# token file: the relay authenticates every request, /metrics included, against
# that single file. Splitting the objects narrows who needs access to the file,
# it does not remove the token from it.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "searxng.relay.scrapeSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "searxng.relay.labels" . | nindent 4 }}
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
type: Opaque
stringData:
  scrape-token: {{ include "searxng.relay.scrapeToken" . | quote }}
{{- end }}
