{{- if .Values.mcpRelay.enabled }}
{{- range $i, $r := (include "searxng.relay.instanceList" $ | fromYamlArray) }}
{{- $inst := dict "ctx" $ "relay" $r }}
{{- if $r.serviceAccount.create }}
{{- if $i }}
---
{{- end }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "searxng.relay.serviceAccountName" $inst }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "searxng.relay.labels" $inst | nindent 4 }}
  {{- with (merge (dict) $r.serviceAccount.annotations $.Values.commonAnnotations) }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: {{ $r.serviceAccount.automountServiceAccountToken }}
{{- end }}
{{- end }}
{{- end }}
