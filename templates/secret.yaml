{{- if not .Values.searxng.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "searxng.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "searxng.serverLabels" . | nindent 4 }}
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
type: Opaque
data:
  # Injected as $SEARXNG_SECRET, which overrides server.secret_key at runtime.
  secret-key: {{ include "searxng.secretKeyValue" . | b64enc | quote }}
{{- end }}
