apiVersion: v2
name: searxng
description: |
  Hardened SearXNG metasearch engine for Kubernetes. Rootless, read-only root
  filesystem, no init containers, NetworkPolicies, Secret-backed credentials and
  an optional Valkey cache.
type: application

# Chart version. Bump on every change to the chart itself.
#
# Reset to 1.0.0 for the first publication: the 1.4.0/1.5.0 that preceded it
# were never tagged and never packaged, so no one could install them and no
# one is owed continuity with them. Everything from here is a promise —
# values.yaml is the public interface, and a breaking change to it takes the
# major.
#
# CI enforces the bump: a pull request touching Chart.yaml, values.yaml,
# values.schema.json, templates/ or .helmignore without raising this fails,
# and once a release exists the number may not go below the published one.
version: 1.0.0

# Default container image tag when `image.tag` is empty.
# NOTE: "latest" is a convenience only. Pin an immutable tag (e.g. 2026.7.22-ef8f6470e)
# or, better, an image digest via `image.digest` for production.
appVersion: "latest"

kubeVersion: ">=1.25.0-0"

home: https://docs.searxng.org
icon: https://raw.githubusercontent.com/searxng/searxng/master/searx/static/themes/simple/img/favicon.png
sources:
  - https://github.com/searxng/searxng
  - https://docs.searxng.org

keywords:
  - searxng
  - metasearch
  - search-engine
  - privacy
  - valkey

maintainers:
  - name: littleoffice
    url: https://github.com/littleoffice

annotations:
  category: Analytics
  licenses: AGPL-3.0
  # Artifact Hub reads these off the packaged chart.
  artifacthub.io/license: AGPL-3.0
  artifacthub.io/links: |
    - name: source
      url: https://github.com/littleoffice/searxng-helm
    - name: MCP relay
      url: https://github.com/littleoffice/mcp-searxng-relay
    - name: Verifying the signature
      url: https://github.com/littleoffice/searxng-helm#verifying-the-chart
  # No artifacthub.io/signKey here on purpose. That annotation is parsed as a
  # YAML object of exactly two fields, `fingerprint` and `url`, describing a
  # *PGP* key that signs a `.prov` file; prose in it fails the package with
  # "invalid annotation: invalid sign key value" and the version never lists.
  # This chart is signed keyless with cosign, so there is no long-lived public
  # key to publish. Artifact Hub detects the cosign signature on the GHCR
  # artifact by itself; the human-readable `cosign verify` invocation lives in
  # the README, linked above.
