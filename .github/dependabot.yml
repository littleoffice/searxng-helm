version: 2
updates:
  # Actions are pinned to commit SHAs, which is the only pin an attacker who
  # gains write access to an action repository cannot move. The cost is that a
  # SHA tells you nothing about how old it is — hence this.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels:
      - ci
    groups:
      actions:
        patterns:
          - "*"
    commit-message:
      prefix: "ci"
