# Yamale schema for Chart.yaml, consumed by `ct lint`.
# https://github.com/23andMe/Yamale
#
# ct ships a default schema, but it predates several apiVersion v2 fields and
# rejects unknown keys, so `kubeVersion` and `annotations` would fail against
# it. This is the same schema widened to what this chart actually uses — which
# also means a typo'd key in Chart.yaml is caught rather than ignored.

apiVersion: str()
name: str()
version: str()
kubeVersion: str(required=False)
description: str(required=False)
type: enum('application', 'library', required=False)
keywords: list(str(), required=False)
home: str(required=False)
sources: list(str(), required=False)
dependencies: list(include('dependency'), required=False)
maintainers: list(include('maintainer'), required=False)
icon: str(required=False)
appVersion: any(str(), num(), required=False)
deprecated: bool(required=False)
annotations: map(str(), key=str(), required=False)

---

maintainer:
  name: str()
  email: str(required=False)
  url: str(required=False)

dependency:
  name: str()
  version: str()
  repository: str(required=False)
  condition: str(required=False)
  tags: list(str(), required=False)
  enabled: bool(required=False)
  import-values: list(any(str(), map()), required=False)
  alias: str(required=False)
