# yamllint rules for `ct lint`, and for the standalone yamllint step in CI.
#
# Tuned to the formatting this repository already uses rather than the other
# way round: no `---` document markers on values files, comments that reach
# into the high 90s, and `on:` in workflow files that must stay a key and not
# become the boolean true.

extends: default

rules:
  braces:
    min-spaces-inside: 0
    max-spaces-inside: 1
  brackets:
    min-spaces-inside: 0
    max-spaces-inside: 0
  comments:
    require-starting-space: true
    min-spaces-from-content: 1
  comments-indentation: disable
  document-start: disable
  empty-lines:
    max: 2
    max-start: 0
    max-end: 1
  indentation:
    spaces: 2
    indent-sequences: consistent
  line-length:
    max: 120
    allow-non-breakable-words: true
    allow-non-breakable-inline-mappings: true
  new-line-at-end-of-file: enable
  trailing-spaces: enable
  truthy:
    # `on:` is a GitHub Actions key, not a boolean.
    check-keys: false
