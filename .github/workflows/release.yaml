name: Release

on:
  push:
    branches: [main]
    paths:
      - Chart.yaml
      - values.yaml
      - values.schema.json
      - templates/**
      - .helmignore
      - README.md
      - LICENSE
  workflow_dispatch:
    inputs:
      force:
        description: Publish even if the tag already exists
        type: boolean
        default: false

permissions: {}

# Releases are not interchangeable, so a second push waits rather than
# cancelling the first — a cancelled run can leave a tag without a package.
concurrency:
  group: release
  cancel-in-progress: false

env:
  # NOTE: kept in step with ci.yaml by hand. Renovate moves both, but they are
  # two separate deps to it, so a bump lands as one PR touching both files
  # only because they are grouped — not because anything enforces equality.
  # renovate: datasource=github-releases depName=helm/helm
  HELM_VERSION: v4.2.3
  # renovate: datasource=github-releases depName=aquasecurity/trivy
  TRIVY_VERSION: 0.73.0

jobs:
  release:
    name: Publish chart
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      # Creating the GitHub Release, pushing the tag, and committing the
      # regenerated index.yaml to gh-pages.
      contents: write
      # Pushing the chart to GHCR as an OCI artifact.
      packages: write
      # Keyless signing and build provenance, both of which mint a short-lived
      # OIDC token rather than holding a private key.
      id-token: write
      attestations: write
    outputs:
      version: ${{ steps.chart.outputs.version }}
      released: ${{ steps.chart.outputs.released }}
      tag: ${{ steps.chart.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Read chart version
        id: chart
        env:
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version:[[:space:]]*//p' Chart.yaml | tr -d '"')"
          name="$(sed -n 's/^name:[[:space:]]*//p' Chart.yaml | tr -d '"')"
          tag="${name}-${version}"

          {
            echo "version=${version}"
            echo "name=${name}"
            echo "tag=${tag}"
          } >> "$GITHUB_OUTPUT"

          if git rev-parse --verify --quiet "refs/tags/${tag}" >/dev/null \
             && [ "${FORCE}" != "true" ]; then
            echo "released=false" >> "$GITHUB_OUTPUT"
            echo "Tag ${tag} already exists; nothing to publish." \
              >> "$GITHUB_STEP_SUMMARY"
          else
            echo "released=true" >> "$GITHUB_OUTPUT"
          fi

      # chart-releaser walks a directory of chart directories. This chart lives
      # at the repository root, so it is staged into one. Copying rather than
      # restructuring the repository keeps `helm install ./searxng-helm`
      # working for anyone who clones it.
      - name: Stage the chart
        if: steps.chart.outputs.released == 'true'
        env:
          CHART_NAME: ${{ steps.chart.outputs.name }}
        run: |
          set -euo pipefail
          dest=".cr-release/${CHART_NAME}"
          mkdir -p "${dest}"
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.cr-release' \
            --exclude='ci' \
            --exclude='hack' \
            --exclude='ct.yaml' \
            ./ "${dest}/"

          # Artifact Hub renders its changelog only from artifacthub.io/changes
          # in the packaged Chart.yaml — it never reads git. Generating it into
          # the staged copy keeps the annotation out of the repository, so a
          # release does not have to describe itself in the commit that creates
          # it, and no bot commit lands on main afterwards.
          .github/ci/gen-changes.sh "${dest}/Chart.yaml"

          # helm still applies .helmignore on top of this; the excludes above
          # only keep rsync from copying directories it would then ignore.
          # Lints after the annotation is written, so a malformed changelog
          # fails here rather than on Artifact Hub's side.
          helm lint "${dest}"

      - name: Publish GitHub Release and update the Helm repo index
        if: steps.chart.outputs.released == 'true'
        uses: helm/chart-releaser-action@cae68fefc6b5f367a0275617c9f83181ba54714f # v1.7.0
        with:
          charts_dir: .cr-release
          skip_existing: true
          pages_branch: gh-pages
          mark_as_latest: true
        env:
          CR_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to GHCR
        if: steps.chart.outputs.released == 'true'
        env:
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Two logins, because there are two credential stores. `helm registry
          # login` writes to Helm's own registry config (HELM_REGISTRY_CONFIG,
          # ~/.config/helm/registry/config.json). actions/attest with
          # push-to-registry — and oras — read ~/.docker/config.json instead and
          # fail with "No credentials found for registry ghcr.io" if only Helm
          # has authenticated.
          printf '%s' "${REGISTRY_TOKEN}" \
            | helm registry login ghcr.io --username "${REGISTRY_USER}" --password-stdin
          printf '%s' "${REGISTRY_TOKEN}" \
            | docker login ghcr.io --username "${REGISTRY_USER}" --password-stdin

      - name: Push to GHCR as an OCI artifact
        id: oci
        if: steps.chart.outputs.released == 'true'
        env:
          CHART_NAME: ${{ steps.chart.outputs.name }}
          CHART_VERSION: ${{ steps.chart.outputs.version }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          owner="$(echo "${OWNER}" | tr '[:upper:]' '[:lower:]')"
          repo="ghcr.io/${owner}/charts"

          helm package ".cr-release/${CHART_NAME}" --destination dist
          package="dist/${CHART_NAME}-${CHART_VERSION}.tgz"

          # helm push writes Pushed/Digest to stderr.
          helm push "${package}" "oci://${repo}" 2>&1 | tee push.log
          digest="$(sed -n 's/^Digest:[[:space:]]*//p' push.log | tail -n 1)"
          if [ -z "${digest}" ]; then
            echo "could not determine the pushed digest" >&2
            exit 1
          fi

          {
            echo "package=${package}"
            echo "image=${repo}/${CHART_NAME}"
            echo "digest=${digest}"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### Published"
            echo
            echo '```console'
            echo "helm install searxng oci://${repo}/${CHART_NAME} --version ${CHART_VERSION}"
            echo '```'
            echo
            echo "Digest: \`${digest}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      # Records, in a transparency log, which workflow at which commit built
      # this artifact. `helm install` will not check it, but `gh attestation
      # verify` and admission controllers can.
      - name: Attest build provenance for the OCI artifact
        if: steps.chart.outputs.released == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.oci.outputs.image }}
          subject-digest: ${{ steps.oci.outputs.digest }}
          push-to-registry: true

      - name: Attest build provenance for the .tgz
        if: steps.chart.outputs.released == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.oci.outputs.package }}

      - name: Install cosign
        if: steps.chart.outputs.released == 'true'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Keyless: the signing certificate is bound to this workflow's OIDC
      # identity and expires in minutes, so there is no key to rotate or leak.
      - name: Sign the OCI artifact
        if: steps.chart.outputs.released == 'true'
        env:
          IMAGE: ${{ steps.oci.outputs.image }}
          DIGEST: ${{ steps.oci.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Verify the signature
        if: steps.chart.outputs.released == 'true'
        env:
          IMAGE: ${{ steps.oci.outputs.image }}
          DIGEST: ${{ steps.oci.outputs.digest }}
          REPO: ${{ github.repository }}
          SERVER: ${{ github.server_url }}
        run: |
          set -euo pipefail
          cosign verify "${IMAGE}@${DIGEST}" \
            --certificate-identity-regexp "^${SERVER}/${REPO}/.github/workflows/release.yaml@" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            > /dev/null
          echo "signature verifies"

      - name: Upload the package
        if: steps.chart.outputs.released == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: searxng-chart-${{ steps.chart.outputs.version }}
          path: dist/*.tgz
          retention-days: 30

  # What was actually shipped, recorded at the moment it shipped.
  #
  # The chart pins images by digest, so "searxng 1.2.3" is a claim about five
  # specific image digests. That claim is only checkable later if the digests
  # and their known CVE state are written down at release time — the scan in
  # CI answers "is main healthy today", which is a different question and
  # stops being true the moment an advisory lands.
  #
  # Deliberately never fails the release. The gate already ran on the commit
  # that produced this tag; re-gating here could only strand a chart that has
  # already been pushed, signed and indexed.
  provenance:
    name: Image manifest and scan report
    needs: [release]
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Install trivy
        run: |
          set -euo pipefail
          base="https://github.com/aquasecurity/trivy/releases/download"
          curl -fsSL \
            "${base}/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" \
            | tar -xz -C /usr/local/bin trivy

      - name: Scan the pinned images
        run: .github/ci/scan-images.sh --report-only

      # One SBOM per image, so a future "are we affected by X" is answerable
      # against a released chart without re-pulling images that may by then
      # have been garbage-collected from the registry.
      - name: Generate SBOMs
        run: |
          set -euo pipefail
          mkdir -p scan/sbom
          jq -r '.images[] | "\(.image)@\(.pinned_digest)"' scan/report.json \
          | while read -r ref; do
              name="$(printf '%s' "${ref%@*}" | tr '/:' '__')"
              trivy image --format cyclonedx --no-progress \
                --output "scan/sbom/${name}.cdx.json" "${ref}"
            done
          ls -l scan/sbom

      - name: Bundle
        id: bundle
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          # The machine-readable pin list, standalone: the one file most
          # likely to be diffed between two chart versions.
          jq '{chart_version, commit, generated, tracked_tag,
               images: [.images[] | {image, pinned_digest, freshness, verdict,
                                     critical, high, vulnerabilities}]}' \
            scan/report.json > "dist/searxng-${VERSION}-images.json"
          cp scan/report.md "dist/searxng-${VERSION}-scan.md"
          tar -czf "dist/searxng-${VERSION}-sbom.tar.gz" -C scan sbom
          ls -l dist
          echo "dir=dist" >> "$GITHUB_OUTPUT"

      - name: Attest the report
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*

      # chart-releaser already created this release; this adds to it.
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          set -euo pipefail
          gh release upload "${TAG}" dist/* --clobber
          {
            echo "### Image scan at release"
            echo
            cat scan/report.md
          } >> "$GITHUB_STEP_SUMMARY"
