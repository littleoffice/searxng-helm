# The config-file side of things.
#
# settings.yml is NOT here: the chart neither renders nor ships one, so it
# comes from a Secret you create. The body for this example lives beside it in
# examples/settings.example.yml.
#
#   kubectl -n search create secret generic searxng-settings \
#     --from-file=settings.yml=examples/settings.example.yml
#
# What the chart does still render for you, because these have to stay in
# lockstep with what it injects:
#
#   <release>-searxng-limiter    limiter.toml       <- searxng.limiter
#   <release>-searxng-extra      arbitrary files    <- searxng.extraConfigFiles
#
# Inspect what you are about to get:
#   helm template searxng ./searxng -f examples/values-config.yaml \
#     -s templates/configmap-limiter.yaml

searxng:
  baseUrl: "https://search.example.com/"

  # --- settings.yml -----------------------------------------------------
  # The Secret created above. The chart mounts its key at
  # /etc/searxng/settings.yml and never reads it.
  existingSettingsSecret: searxng-settings
  existingSettingsSecretKey: settings.yml

  # The two settings the chart needs for objects outside that file. Keep them
  # in step with server.port and server.limiter in examples/settings.example.yml
  # — a disagreement leaves the probes pointed at a closed port, or the
  # container starting without the limiter.toml it expects.
  port: 8080

  # --- limiter.toml -----------------------------------------------------
  limiter:
    # Mirrors server.limiter in settings.yml. Needs Valkey; the chart refuses
    # to render without one.
    enabled: true
    publicInstance: false
    # MUST cover your ingress controller's pod network or every request is
    # attributed to one client. Narrow this to the controller's CIDR if you can.
    trustedProxies:
      - "127.0.0.0/8"
      - "::1"
      - "10.0.0.0/8"
    passIp:
      - "10.42.0.0/16"     # e.g. an internal subnet you never want limited
    blockIp: []

  # --- arbitrary extra files in /etc/searxng ----------------------------
  extraConfigFiles:
    favicons.toml: |
      [favicons]
      cfg_schema = 1

valkey:
  enabled: true
  architecture: standalone
