# =============================================================================
# Example Secrets for the searxng chart.
# =============================================================================
# EVERY VALUE BELOW IS A PLACEHOLDER. Do not apply as-is — run
# ./gen-secrets.sh instead, or replace each REPLACE_ME by hand.
#
# The settings one is required. For the rest you only need the Secrets for the
# features you turn on, and only if you want to manage them yourself: leave the
# matching `existingSecret` value empty and the chart generates and maintains
# those for you (see the GitOps note in the README before relying on that).
#
# Apply with:  kubectl -n <namespace> apply -f secrets.example.yaml
# =============================================================================

---
# -----------------------------------------------------------------------------
# 0. settings.yml                       -> searxng.existingSettingsSecret
# -----------------------------------------------------------------------------
# REQUIRED. The chart mounts this file at /etc/searxng/settings.yml and never
# writes it: engine `tokens`, per-engine `api_key` fields and `outgoing.proxies`
# credentials can only live here, so it stays out of values entirely. With no
# Secret named, the chart refuses to render.
#
# The body below is the smallest file SearXNG will start on. Replace it with
# your own — settings.example.yml in this directory is a worked one, and
# anything from https://docs.searxng.org/admin/settings/ is valid.
#
# Keep server.port and server.limiter in step with searxng.port and
# searxng.limiter.enabled in values: the chart drives the container port, the
# probes, the NetworkPolicy and limiter.toml from those, and cannot read this.
apiVersion: v1
kind: Secret
metadata:
  name: searxng-settings
  labels:
    app.kubernetes.io/part-of: searxng
type: Opaque
stringData:
  settings.yml: |
    use_default_settings: true

    general:
      instance_name: "SearXNG"

    server:
      port: 8080
      bind_address: "::"
      limiter: false

---
# -----------------------------------------------------------------------------
# 1. SearXNG secret_key                       -> searxng.existingSecret
# -----------------------------------------------------------------------------
# Signs user preference cookies. Changing it logs everyone out.
#   openssl rand -hex 32
apiVersion: v1
kind: Secret
metadata:
  name: searxng-secret
  labels:
    app.kubernetes.io/part-of: searxng
type: Opaque
stringData:
  secret-key: "REPLACE_ME_64_HEX_CHARS_0000000000000000000000000000000000000000"

---
# -----------------------------------------------------------------------------
# 1b. /metrics basic auth                     -> searxng.metrics.existingSecret
# -----------------------------------------------------------------------------
# Only when searxng.metrics.enabled=true.
#
# `password` must equal general.open_metrics inside the settings.yml Secret
# above: this is what the ServiceMonitor presents, that is what SearXNG checks
# it against. The chart reads neither, so the two are yours to keep in step —
# gen-secrets.sh generates one value and writes both.
#
# SearXNG only checks the password. The username is here rather than in values
# so the chart has a single object to point at.
apiVersion: v1
kind: Secret
metadata:
  name: searxng-metrics
  labels:
    app.kubernetes.io/part-of: searxng
type: Opaque
stringData:
  username: "prometheus"
  password: "REPLACE_ME_SAME_AS_GENERAL_OPEN_METRICS"

---
# -----------------------------------------------------------------------------
# 2. Valkey                                   -> valkey.auth.existingSecret
# -----------------------------------------------------------------------------
# NOTE: setting valkey.auth.existingSecret suppresses the chart's own Valkey
# Secret entirely, and the config files live in that same Secret — so a BYO
# Secret must carry valkey.conf as well as the password. That is the price of
# keeping `requirepass` out of the process list.
#
# The password must be URL-safe (it is embedded in the connection URL):
#   openssl rand -hex 16      # or: tr -dc 'A-Za-z0-9' </dev/urandom | head -c 32
#
# The same password appears three times: `valkey-password`, `requirepass` in
# both configs, and `masterauth` in the replica config. Keep them in sync.
#
# Drop the valkey-replica.conf key entirely if architecture is `standalone`.
#
# IMPORTANT: this file is applied with `kubectl apply`, not rendered by Helm.
# Nothing in it is substituted. The `replicaof` line below is a literal string
# and you must edit it by hand to match your install, or the replicas will
# never find the primary.
#
# The hostname is <fullname>-valkey-primary.<namespace>.svc, where <fullname>
# follows Helm's usual rule:
#
#   helm install searxng ... -n search  ->  searxng-valkey-primary.search.svc
#   helm install sx ...      -n search  ->  sx-searxng-valkey-primary.search.svc
#
# i.e. the release name is used as-is when it already contains "searxng",
# otherwise "-searxng" is appended. Run `gen-secrets.sh` to have this filled in
# correctly for you, or check against:
#   helm template <release> ./searxng -n <ns> -s templates/valkey/service.yaml
apiVersion: v1
kind: Secret
metadata:
  name: searxng-valkey
  labels:
    app.kubernetes.io/part-of: searxng
type: Opaque
stringData:
  valkey-password: "REPLACE_ME_URL_SAFE_PASSWORD"

  valkey.conf: |
    port 6379
    protected-mode yes
    requirepass REPLACE_ME_URL_SAFE_PASSWORD
    dir /data
    loglevel warning
    save ""
    appendonly no
    maxmemory-policy allkeys-lru
    # Only needed when architecture is `replication`:
    repl-diskless-sync yes
    repl-diskless-sync-delay 5

  valkey-replica.conf: |
    port 6379
    protected-mode yes
    requirepass REPLACE_ME_URL_SAFE_PASSWORD
    masterauth REPLACE_ME_URL_SAFE_PASSWORD
    dir /data
    loglevel warning
    save ""
    appendonly no
    replicaof <release>-searxng-valkey-primary.<namespace>.svc 6379
    replica-read-only yes
    replica-serve-stale-data yes
    maxmemory-policy allkeys-lru

---
# -----------------------------------------------------------------------------
# 3. External Valkey                          -> valkey.external.existingSecret
# -----------------------------------------------------------------------------
# Only when valkey.enabled=false. Not needed alongside Secret 2.
# Percent-encode any reserved characters in the password.
apiVersion: v1
kind: Secret
metadata:
  name: searxng-valkey-external
  labels:
    app.kubernetes.io/part-of: searxng
type: Opaque
stringData:
  valkey-url: "valkey://:REPLACE_ME_PASSWORD@valkey.data.svc:6379/0"

---
# -----------------------------------------------------------------------------
# 4. MCP relay bearer tokens                  -> mcpRelay.auth.existingSecret
# -----------------------------------------------------------------------------
# One `identity:token` per line. The identity is a log-correlation label, so
# give each client its own — that is what makes the audit log useful, and it
# lets you revoke one client without touching the others.
#
# Tokens must be at least 32 characters. Identities must not contain a colon.
#   openssl rand -hex 32
#
apiVersion: v1
kind: Secret
metadata:
  name: searxng-mcp-relay
  labels:
    app.kubernetes.io/part-of: searxng
type: Opaque
stringData:
  tokens: |
    # identity:token
    claude-desktop:REPLACE_ME_TOKEN_A_AT_LEAST_32_CHARS_LONG_000000
    agent-ci:REPLACE_ME_TOKEN_B_AT_LEAST_32_CHARS_LONG_000000
    prometheus:REPLACE_ME_TOKEN_C_AT_LEAST_32_CHARS_LONG_000000

---
# -----------------------------------------------------------------------------
# 5. MCP relay scrape credential           -> mcpRelay.metrics.existingSecret
# -----------------------------------------------------------------------------
# Only when mcpRelay.metrics.enabled=true.
#
# Deliberately a separate object from the token file above, so that read access
# for Prometheus can be scoped to this Secret alone:
#
#   rules:
#     - apiGroups: [""]
#       resources: [secrets]
#       resourceNames: [searxng-mcp-relay-scrape]
#       verbs: [get]
#
# The value must equal the `prometheus` line in `tokens`. That duplication is
# unavoidable — the relay authenticates every request, /metrics included,
# against the single token file, so the token has to appear there too. What
# the split buys you is that the monitoring stack never needs read access to
# the file holding your agent tokens.
apiVersion: v1
kind: Secret
metadata:
  name: searxng-mcp-relay-scrape
  labels:
    app.kubernetes.io/part-of: searxng
type: Opaque
stringData:
  scrape-token: "REPLACE_ME_TOKEN_C_AT_LEAST_32_CHARS_LONG_000000"

---
# -----------------------------------------------------------------------------
# 6. SearXNG private-engine tokens          -> mcpRelay.searxngTokens.existingSecret
# -----------------------------------------------------------------------------
# Comma-separated, forwarded as the `tokens` search parameter on every query.
# These are the values on the `tokens:` list of a private engine in your
# settings.yml — the relay is invisible to that engine without them.
#
# Give each relay only its own token: that is what scopes two relays to two
# different sets of engines on one SearXNG.
apiVersion: v1
kind: Secret
metadata:
  name: searxng-relay-engine-tokens
  labels:
    app.kubernetes.io/part-of: searxng
type: Opaque
stringData:
  searxng-tokens: "REPLACE_ME_ENGINE_TOKEN_A,REPLACE_ME_ENGINE_TOKEN_B"

---
# -----------------------------------------------------------------------------
# 7. Relay fence signing key                -> mcpRelay.fenceKey.existingSecret
# -----------------------------------------------------------------------------
# Only when something verifies the <sec:fence> signatures on tool responses.
# Without it each relay process signs with a key it generated at startup, which
# is fine until a verifier needs a fingerprint it can pin.
#
#   openssl genpkey -algorithm ed25519 -out fence.pem
#
# PKCS#8 PEM, base64 PKCS#8 DER, a base64 32-byte seed or a base64 64-byte
# private key all work. Mounted as a file; a malformed key fails the relay's
# startup rather than silently falling back.
apiVersion: v1
kind: Secret
metadata:
  name: searxng-relay-fence
  labels:
    app.kubernetes.io/part-of: searxng
type: Opaque
stringData:
  fence-key: |
    -----BEGIN PRIVATE KEY-----
    REPLACE_ME_WITH_THE_OUTPUT_OF_OPENSSL_GENPKEY_ED25519
    -----END PRIVATE KEY-----

---
# -----------------------------------------------------------------------------
# 8. Relay /health token                    -> mcpRelay.healthToken.existingSecret
# -----------------------------------------------------------------------------
# Optional, and separate from the bearer tokens in 4: whatever polls /health
# should not thereby hold a credential that can call the tools. Unset leaves
# /health open, which is usually right for a ClusterIP service and wrong once
# the relay Ingress is enabled.
#
# At least 32 characters:  openssl rand -hex 32
#
# Setting this switches the readiness probe to the relay's own --healthcheck
# self-probe, which reads the token from its environment — so the value stays
# in this Secret instead of appearing as a literal probe header.
apiVersion: v1
kind: Secret
metadata:
  name: searxng-relay-health
  labels:
    app.kubernetes.io/part-of: searxng
type: Opaque
stringData:
  health-token: "REPLACE_ME_AT_LEAST_32_CHARACTERS_LONG_0000"
