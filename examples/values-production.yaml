# Everything on, and GitOps-safe: every credential comes from a Secret you
# manage, so nothing is regenerated when Argo CD or Flux re-renders.
#
#   ./gen-secrets.sh searxng search replication > secrets.yaml
#   kubectl -n search apply -f secrets.yaml
#   helm install searxng ./searxng -n search -f examples/values-production.yaml
#
# gen-secrets.sh emits a starter settings.yml Secret along with the
# credentials. Edit that Secret before you rely on it — it is your
# configuration, and the chart has no copy of it.
#
# Replace the two example.com hosts and the ingress-controller namespace.

image:
  tag: "2026.7.22-ef8f6470e"    # pin something real
  pullPolicy: IfNotPresent

replicaCount: 3

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 75

podDisruptionBudget:
  enabled: true
  maxUnavailable: 1

topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: ScheduleAnyway
  - maxSkew: 1
    topologyKey: topology.kubernetes.io/zone
    whenUnsatisfiable: ScheduleAnyway

resources:
  requests:
    cpu: 200m
    memory: 512Mi
  limits:
    memory: 1Gi

# -----------------------------------------------------------------------------
searxng:
  baseUrl: "https://search.example.com/"

  # From gen-secrets.sh, not generated by the chart.
  existingSecret: searxng-searxng-secret
  existingSecretKey: secret-key
  existingSettingsSecret: searxng-searxng-settings
  existingSettingsSecretKey: settings.yml

  # Mirrors server.port / server.limiter in that Secret's settings.yml. The
  # chart cannot read the file, and these drive the container port, the probes,
  # the NetworkPolicy and limiter.toml.
  port: 8080

  metrics:
    enabled: true
    # The basic-auth pair the ServiceMonitor presents, from gen-secrets.sh.
    # Its password half is the same value that script wrote into
    # general.open_metrics in the settings Secret — SearXNG checks one against
    # the other, and the chart can read neither.
    existingSecret: searxng-searxng-metrics
    existingSecretUsernameKey: username
    existingSecretPasswordKey: password
    # gen-secrets.sh leaves general.enable_metrics / open_metrics commented out
    # in the settings Secret it writes. Uncomment them there before enabling
    # this, or SearXNG answers /metrics with 404 and the scrape never works.

  limiter:
    # Mirrors server.limiter / server.public_instance in settings.yml.
    enabled: true
    publicInstance: false
    trustedProxies:
      - "127.0.0.0/8"
      - "::1"
      - "10.0.0.0/8"        # narrow to your ingress controller's CIDR

# -----------------------------------------------------------------------------
valkey:
  enabled: true
  architecture: replication
  replica:
    count: 2
    podAntiAffinityPreset: soft
  auth:
    enabled: true
    # Carries valkey-password AND the conf files. See secrets.example.yaml.
    existingSecret: searxng-searxng-valkey
  persistence:
    enabled: false          # it is a cache
  metrics:
    enabled: true

# -----------------------------------------------------------------------------
mcpRelay:
  enabled: true
  image:
    tag: "v1.0.0"           # pin a real upstream release

  # Everything non-secret about the relays lives in ConfigMaps you manage. This
  # one is shared by every instance; give an instance its own
  # `existingConfigMap` to override any of it.
  #
  #   kubectl -n search create configmap relay-config \
  #     --from-literal=MCP_RATE_LIMIT_RPS=5 \
  #     --from-literal=LOG_LEVEL=info
  config:
    MAX_PDF_BYTES: "50000000"

  defaults:
    replicaCount: 1         # sessions are in-memory; see README before scaling
    podDisruptionBudget:
      enabled: false

  instances:
    - name: default
      existingConfigMap: relay-config
      auth:
        existingSecret: searxng-searxng-mcp-relay
        existingSecretKey: tokens
      metrics:
        enabled: true
        existingSecret: searxng-searxng-mcp-relay-scrape
      ingress:
        enabled: true
        className: nginx
        annotations:
          cert-manager.io/cluster-issuer: letsencrypt-prod
        hosts:
          - host: mcp.example.com
            paths:
              - path: /
                pathType: Prefix
        tls:
          - secretName: mcp-tls
            hosts: [mcp.example.com]

    # A second team, reaching only its own private engines. Its Secrets and
    # ConfigMap are yours to create; nothing about it is in this file.
    # - name: team-a
    #   existingConfigMap: relay-team-a-config
    #   searxngTokens:
    #     existingSecret: relay-team-a-engines
    #   auth:
    #     identities:
    #       - name: claude-desktop
    #       - name: ci-agent

# -----------------------------------------------------------------------------
ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-body-size: 1m
  hosts:
    - host: search.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: searxng-tls
      hosts: [search.example.com]

# -----------------------------------------------------------------------------
networkPolicy:
  enabled: true
  ingress:
    allowSameNamespace: true
    fromNamespaces:
      - ingress-nginx       # <- where YOUR controller runs
  egress:
    internet:
      enabled: true

metrics:
  serviceMonitor:
    enabled: true
    labels:
      release: kube-prometheus-stack   # must match serviceMonitorSelector
    interval: 30s
  allowScrapeFromNamespaces:
    - monitoring
