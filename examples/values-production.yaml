# Everything on, and GitOps-safe: every credential comes from a Secret you
# manage, so nothing is regenerated when Argo CD or Flux re-renders.
#
#   ./gen-secrets.sh searxng search replication > secrets.yaml
#   kubectl -n search apply -f secrets.yaml
#   helm install searxng ./searxng -n search -f examples/values-production.yaml
#
# Replace the two example.com hosts and the ingress-controller namespace.

image:
  tag: "2026.7.22-ef8f6470e"    # pin something real
  pullPolicy: IfNotPresent

replicaCount: 3

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 75

podDisruptionBudget:
  enabled: true
  maxUnavailable: 1

topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: ScheduleAnyway
  - maxSkew: 1
    topologyKey: topology.kubernetes.io/zone
    whenUnsatisfiable: ScheduleAnyway

resources:
  requests:
    cpu: 200m
    memory: 512Mi
  limits:
    memory: 1Gi

# -----------------------------------------------------------------------------
searxng:
  baseUrl: "https://search.example.com/"

  # From gen-secrets.sh, not generated by the chart.
  existingSecret: searxng-searxng-secret
  existingSecretKey: secret-key

  metrics:
    enabled: true
    # Leaving password empty is fine even under GitOps: it lives in the
    # chart-managed settings Secret, not in a resource you hand-maintain.
    password: ""
    username: prometheus

  settings:
    general:
      instance_name: "Example Search"
    server:
      limiter: true
      public_instance: false
      image_proxy: true
    search:
      safe_search: 1
      formats: [html]

  limiter:
    trustedProxies:
      - "127.0.0.0/8"
      - "::1"
      - "10.0.0.0/8"        # narrow to your ingress controller's CIDR

# -----------------------------------------------------------------------------
valkey:
  enabled: true
  architecture: replication
  replica:
    count: 2
    podAntiAffinityPreset: soft
  auth:
    enabled: true
    # Carries valkey-password AND the conf files. See secrets.example.yaml.
    existingSecret: searxng-searxng-valkey
  persistence:
    enabled: false          # it is a cache
  metrics:
    enabled: true

# -----------------------------------------------------------------------------
mcpRelay:
  enabled: true
  image:
    tag: "v1.0.0"           # pin a real upstream release
  replicaCount: 1           # sessions are in-memory; see README before scaling
  stateless: false
  auth:
    existingSecret: searxng-searxng-mcp-relay
    existingSecretKey: tokens
  metrics:
    enabled: true
    existingSecret: searxng-searxng-mcp-relay-scrape
  rateLimit:
    rps: 5
    exempt: []
  fetch:
    allowedHosts: []        # keep the SSRF guard closed unless you need it
    allowedCIDRs: []
  ingress:
    enabled: true
    className: nginx
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
    hosts:
      - host: mcp.example.com
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: mcp-tls
        hosts: [mcp.example.com]

# -----------------------------------------------------------------------------
ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-body-size: 1m
  hosts:
    - host: search.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: searxng-tls
      hosts: [search.example.com]

# -----------------------------------------------------------------------------
networkPolicy:
  enabled: true
  ingress:
    allowSameNamespace: true
    fromNamespaces:
      - ingress-nginx       # <- where YOUR controller runs
  egress:
    internet:
      enabled: true

metrics:
  serviceMonitor:
    enabled: true
    labels:
      release: kube-prometheus-stack   # must match serviceMonitorSelector
    interval: 30s
  allowScrapeFromNamespaces:
    - monitoring
