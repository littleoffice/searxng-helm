# ci-pre-install: kubectl -n "$NAMESPACE" create secret generic ci-settings --from-file=ci/settings.yml
#
# `--from-file` keys the Secret by the file's basename, so the key is
# settings.yml — which is what the values block at the bottom names.
# Scenario: Valkey in replication mode, with the redis_exporter sidecar.
#
# Exercises the second StatefulSet, the replica Service, the replica PDB and
# the `replicaof` wiring in valkey.conf — none of which are touched by the
# standalone path. One replica rather than the default two: a single kind node
# with `podAntiAffinityPreset: soft` will schedule both, but there is no point
# paying for the second.

replicaCount: 1

podDisruptionBudget:
  enabled: false

resources:
  requests:
    cpu: 50m
    memory: 256Mi
  limits:
    memory: 768Mi

valkey:
  enabled: true
  architecture: replication
  replica:
    count: 1
    podAntiAffinityPreset: soft
    podDisruptionBudget:
      enabled: false
  auth:
    enabled: true
  persistence:
    # A cache. Also keeps the test off the local-path provisioner.
    enabled: false
  metrics:
    enabled: true

networkPolicy:
  enabled: true
  ingress:
    allowSameNamespace: true

tests:
  enabled: true

searxng:
  # The chart does not write settings.yml; the pre-install directive above
  # creates the Secret holding it.
  existingSettingsSecret: ci-settings
  existingSettingsSecretKey: settings.yml
  # Mirrors server.port / server.limiter in ci/settings.yml.
  port: 8080
  limiter:
    enabled: false
