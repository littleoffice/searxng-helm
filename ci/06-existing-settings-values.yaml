# ci-release: extsettings
# ci-pre-install: kubectl -n "$NAMESPACE" create secret generic searxng-settings --from-file=ci/06-settings.yml
#
# Scenario: settings.yml comes from a Secret the user manages. The body lives in
# ci/06-settings.yml, which `kubectl --from-file` keys by its basename — so the
# key is `06-settings.yml`, deliberately not `settings.yml`. The chart projects
# whatever key is named to the fixed mount path, so a wrong `items.key` shows up
# as a CrashLoop here rather than passing quietly.
#
# The body is a separate file rather than a heredoc in the directive above
# because that directive is read as a single line and yamllint caps lines at
# 120. `.yml` keeps it out of the `ci/*-values.yaml` glob that ct and the render
# jobs iterate.
#
# What this is meant to catch:
#   * the chart still rendering (and mounting) its own settings.yml
#   * the Deployment carrying a checksum/config for content it cannot see
#   * server.port drifting between values and the mounted file, which would
#     leave the probes pointed at a closed port

replicaCount: 1

podDisruptionBudget:
  enabled: false

resources:
  requests:
    cpu: 50m
    memory: 256Mi
  limits:
    memory: 768Mi

valkey:
  enabled: false

networkPolicy:
  enabled: false

searxng:
  existingSettingsSecret: searxng-settings
  existingSettingsSecretKey: 06-settings.yml

  # Ignored for the file's contents, but server.* is still what drives the
  # container port and the limiter, so it has to agree with the Secret above.
  settings:
    server:
      port: 8080
      limiter: false

tests:
  enabled: true
