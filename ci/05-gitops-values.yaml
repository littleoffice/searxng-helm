# ci-release: gitops
# ci-pre-install: examples/gen-secrets.sh gitops "$NAMESPACE" standalone | kubectl apply -n "$NAMESPACE" -f -
#
# Scenario: nothing is generated by the chart. Every credential arrives from a
# Secret that already exists, which is the only mode that is safe under Argo CD
# or Flux — `lookup` returns nothing during a server-side diff, so a chart that
# mints its own passwords will show a permanent drift and re-roll the pods.
#
# The two directives above are read by the install workflow: it fixes the
# release name to `gitops` (the Secret names below are derived from it) and
# runs examples/gen-secrets.sh into the namespace first. That makes this
# scenario a test of the example script as well as of the chart.

replicaCount: 1

podDisruptionBudget:
  enabled: false

resources:
  requests:
    cpu: 50m
    memory: 256Mi
  limits:
    memory: 768Mi

searxng:
  existingSecret: gitops-searxng-secret
  existingSecretKey: secret-key

valkey:
  enabled: true
  architecture: standalone
  auth:
    enabled: true
    existingSecret: gitops-searxng-valkey
    existingSecretPasswordKey: valkey-password

mcpRelay:
  enabled: true
  replicaCount: 1
  auth:
    existingSecret: gitops-searxng-mcp-relay
    existingSecretKey: tokens
  metrics:
    enabled: true
    existingSecret: gitops-searxng-mcp-relay-scrape
    existingSecretKey: scrape-token
  podDisruptionBudget:
    enabled: false
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      memory: 128Mi

# The relay's ServiceMonitor would need the operator CRDs; the point of this
# scenario is the credential plumbing, so leave them out.
metrics:
  serviceMonitor:
    enabled: false

networkPolicy:
  enabled: true
  ingress:
    allowSameNamespace: true

tests:
  enabled: true
